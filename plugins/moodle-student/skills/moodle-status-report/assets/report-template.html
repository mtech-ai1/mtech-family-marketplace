<title>מטלות מודל – מכללה ירושלים</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: one reading column grouped by urgency; each task row = date block + details (RTL). Data-driven: everything renders from #report-data. */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --fg:#1d2330; --muted:#5d6676; --line:#e1e4ea; --accent:#2f5bd3;
  --late:#c2361f; --late-bg:#fdecea; --soon:#a85d00; --soon-bg:#fff3e0;
  --open:#5c5f6b; --open-bg:#eef0f4; --done:#1e7a46; --done-bg:#e6f4ec; --warn:#8a5a00; --warn-bg:#fff6d9;
  --display:"Rubik",system-ui,sans-serif; --body:"Assistant",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151b; --surface:#1b1f27; --fg:#e7eaf0; --muted:#9aa3b2; --line:#2b313c; --accent:#7c9cff;
  --late:#ff8a75; --late-bg:#3a1d19; --soon:#ffb85c; --soon-bg:#3a2a12; --open:#b7bcc8; --open-bg:#262b35;
  --done:#6fd39a; --done-bg:#16301f; --warn:#ffd36b; --warn-bg:#352c12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151b; --surface:#1b1f27; --fg:#e7eaf0; --muted:#9aa3b2; --line:#2b313c; --accent:#7c9cff;
  --late:#ff8a75; --late-bg:#3a1d19; --soon:#ffb85c; --soon-bg:#3a2a12; --open:#b7bcc8; --open-bg:#262b35;
  --done:#6fd39a; --done-bg:#16301f; --warn:#ffd36b; --warn-bg:#352c12; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:820px;margin:0 auto;padding-block:32px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:32px}
header h1{font-family:var(--display);font-size:1.9rem;margin:0 0 4px;text-wrap:balance}
header p{margin:0;color:var(--muted)}
.summary{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.pill{font-weight:700;font-size:.85rem;padding:4px 12px;border-radius:999px;font-variant-numeric:tabular-nums}
.p-overdue{background:var(--late-bg);color:var(--late)} .p-upcoming{background:var(--soon-bg);color:var(--soon)}
.p-open-nodate{background:var(--open-bg);color:var(--open)} .p-done{background:var(--done-bg);color:var(--done)}
section h2{font-family:var(--display);font-size:1.15rem;margin:0 0 12px;display:flex;align-items:center;gap:8px}
section h2 .dot{width:10px;height:10px;border-radius:50%}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.task{display:grid;grid-template-columns:76px 1fr;gap:16px;padding:14px 16px;border-top:1px solid var(--line);align-items:start}
.task:first-child{border-top:0}
.date{text-align:center;border-radius:8px;padding:6px 4px;font-variant-numeric:tabular-nums}
.date .d{font-family:var(--display);font-size:1.3rem;font-weight:700;line-height:1.1}
.date .m{font-size:.78rem}
.s-overdue .date{background:var(--late-bg);color:var(--late)} .s-upcoming .date{background:var(--soon-bg);color:var(--soon)}
.s-open-nodate .date,.s-unknown .date{background:var(--open-bg);color:var(--open)} .s-done .date{background:var(--done-bg);color:var(--done)}
.body{min-width:0;display:flex;flex-direction:column;gap:4px}
.title{font-weight:700;font-size:1.05rem}
.title a{color:var(--fg);text-decoration:none;border-bottom:1px solid var(--line)}
.title a:hover,.title a:focus-visible{color:var(--accent);border-color:var(--accent)}
.course{font-size:.9rem;color:var(--muted)} .course a{color:var(--muted)} .course a:hover{color:var(--accent)}
.lect{color:var(--fg);font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.tag{font-size:.8rem;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--open-bg);color:var(--open)}
.tag.late{background:var(--late-bg);color:var(--late)} .tag.soon{background:var(--soon-bg);color:var(--soon)} .tag.done{background:var(--done-bg);color:var(--done)}
.note{font-size:.92rem;margin:4px 0 0}
.alert{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:6px 10px;font-size:.9rem;font-weight:600;margin-top:4px}
.empty{padding:14px 16px;color:var(--muted)}
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.courses a{display:flex;flex-direction:column;gap:2px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;color:var(--fg);text-decoration:none;min-width:0}
.courses a:hover,.courses a:focus-visible{border-color:var(--accent)}
.courses .cn{font-weight:600;font-size:.95rem} .courses .cl{font-size:.88rem;color:var(--accent);font-weight:600}
.courses .cs{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums} .courses .has{color:var(--soon);font-weight:700}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
footer{font-size:.85rem;color:var(--muted)}
</style>

<div class="wrap" id="app" dir="rtl" lang="he"><p>טוען…</p></div>

<script type="application/json" id="report-data">/*REPORT_DATA*/</script>
<script>
(function(){
  var D; try{ D = JSON.parse(document.getElementById('report-data').textContent); }catch(e){ document.getElementById('app').textContent='שגיאה בנתוני הדוח'; return; }
  var SITE = D.site || 'https://moodle4.michlala.edu';
  var now = Date.now();
  var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); };
  var courses = {}; (D.courses||[]).forEach(function(c){ courses[c.id]=c; });
  var short = function(n){ return String(n||'').replace(/\s*-\s*\d{5}\..*$/,'').replace(/\s+מור$/,''); };
  var actUrl = function(t){ return t.url || (SITE+'/mod/'+t.mod+'/view.php?id='+t.cmid); };
  var courseUrl = function(id){ return SITE+'/course/view.php?id='+id; };
  var dt = function(ts){ return ts ? new Date(ts*1000) : null; };
  var DAYS=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
  function countdown(ts){
    var diff = ts*1000 - now, h = Math.round(Math.abs(diff)/3600000), d = Math.round(Math.abs(diff)/86400000);
    if(diff<0) return {cls:'late', txt: h<48 ? 'באיחור של '+h+' שעות' : 'באיחור של '+d+' ימים'};
    if(h<48) return {cls:'late', txt:'נשארו '+h+' שעות'};
    return {cls: d<=14?'soon':'', txt:'עוד '+d+' ימים'};
  }
  var MODLABEL={assign:'מטלה',quiz:'שאלון/בוחן',questionnaire:'שאלון משוב',workshop:'הערכת עמיתים',lesson:'שיעור',feedback:'משוב',forum:'פורום'};
  var STATUSLABEL={overdue:'לא הוגש',upcoming:'לא הוגש','open-nodate':'לא הוגש',unknown:'סטטוס לא ידוע',done:'הוגש'};
  function row(t){
    var c = courses[t.courseid]||{}, d = dt(t.due), dateHtml;
    var gp = String(t.grade||'').split('/').map(function(x){ var n=parseFloat(String(x).replace(',','.')); return isNaN(n)?x.trim():String(+n.toFixed(2)); });
    if(t.status==='done' && t.grade) dateHtml = '<div class="d">'+esc(gp[0])+'</div><div class="m">'+(gp[1]?'מתוך '+esc(gp[1]):'ציון')+'</div>';
    else if(d) dateHtml = '<div class="d">'+d.getDate()+'.'+(d.getMonth()+1)+'</div><div class="m">'+(d.getFullYear()!==new Date().getFullYear()?d.getFullYear()+', ':'יום '+DAYS[d.getDay()]+' ')+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+'</div>';
    else dateHtml = '<div class="d">—</div><div class="m">'+(t.open?('נפתחה '+dt(t.open).getDate()+'.'+(dt(t.open).getMonth()+1)):'בלי תאריך')+'</div>';
    var tags = ['<span class="tag '+(t.status==='done'?'done':(t.status==='overdue'?'late':(t.status==='upcoming'?'soon':'')))+'">'+esc(t.statusLabel||STATUSLABEL[t.status]||'')+'</span>'];
    if(MODLABEL[t.mod]) tags.push('<span class="tag">'+MODLABEL[t.mod]+'</span>');
    (t.tags||[]).forEach(function(x){ tags.push('<span class="tag">'+esc(x)+'</span>'); });
    if(d && t.status!=='done'){ var cd=countdown(t.due); tags.push('<span class="tag '+cd.cls+'">'+cd.txt+'</span>'); }
    var teachers = (c.teachers||[]).join(', ');
    return '<div class="task s-'+esc(t.status)+'"><div class="date">'+dateHtml+'</div><div class="body">'
      +'<div class="title"><a href="'+esc(actUrl(t))+'" target="_blank" rel="noopener">'+esc(t.name)+'</a></div>'
      +'<div class="course"><a href="'+esc(courseUrl(t.courseid))+'" target="_blank" rel="noopener">'+esc(short(c.name))+(c.code?' ('+esc(c.code)+')':'')+'</a>'+(teachers?' · <span class="lect">'+esc(teachers)+'</span>':'')+'</div>'
      +'<div class="meta">'+tags.join('')+'</div>'
      +(t.alerts||[]).map(function(a){return '<div class="alert">'+esc(a)+'</div>';}).join('')
      +(t.note?'<p class="note">'+esc(t.note)+'</p>':'')
      +'</div></div>';
  }
  var groups=[['overdue','באיחור','var(--late)'],['upcoming','עם תאריך הגשה','var(--soon)'],['open-nodate','פתוחות בלי תאריך הגשה','var(--open)'],['unknown','סטטוס לא ידוע – לבדוק ידנית','var(--open)'],['done','הוגש','var(--done)']];
  var tasks = (D.tasks||[]).filter(function(t){ return !t.hidden; });
  var count = function(s){ return tasks.filter(function(t){return t.status===s;}).length; };
  var html = '<header><h1>'+esc(D.title||'מטלות מודל – מכללה ירושלים')+'</h1><p>'+esc(D.subtitle||('תמונת מצב מ־'+new Date(D.scannedAt||Date.now()).toLocaleString('he-IL',{dateStyle:'short',timeStyle:'short'})+'. הקישורים נפתחים במודל ודורשים התחברות.'))+'</p><div class="summary">'
    + [['overdue','באיחור'],['upcoming','עם תאריך'],['open-nodate','בלי תאריך'],['done','הוגשו']].map(function(p){ return '<span class="pill p-'+p[0]+'">'+count(p[0])+' '+p[1]+'</span>'; }).join('')
    + '</div></header>';
  groups.forEach(function(g){
    var list = tasks.filter(function(t){ return t.status===g[0]; });
    if(!list.length && (g[0]==='unknown' || g[0]==='overdue')) return;
    html += '<section><h2><span class="dot" style="background:'+g[2]+'"></span>'+g[1]+'</h2><div class="list">'+(list.length?list.map(row).join(''):'<div class="empty">אין</div>')+'</div></section>';
  });
  var openBy = {}; tasks.forEach(function(t){ if(t.status!=='done'){ openBy[t.courseid]=openBy[t.courseid]||{n:0,late:0}; openBy[t.courseid].n++; if(t.status==='overdue') openBy[t.courseid].late++; } });
  var cs = (D.courses||[]).slice().sort(function(a,b){ return ((openBy[b.id]||{}).n||0)-((openBy[a.id]||{}).n||0); });
  html += '<section><h2>כל הקורסים</h2><div class="courses">'+cs.map(function(c){
    var o = openBy[c.id], badge = o ? ' · <span class="has">'+(o.late?o.late+' באיחור':o.n+' פתוחות')+'</span>' : '';
    return '<a href="'+esc(courseUrl(c.id))+'" target="_blank" rel="noopener"><span class="cn">'+esc(short(c.name))+'</span>'+((c.teachers||[]).length?'<span class="cl">'+esc(c.teachers.join(', '))+'</span>':'')+'<span class="cs">'+esc([c.code,c.semester].filter(Boolean).join(' · '))+badge+'</span></a>';
  }).join('')+'</div></section>';
  html += '<footer>'+esc(D.footer||'נבדקו מטלות, שאלונים ולוח השנה בכל הקורסים. מטלות שמופיעות רק כטקסט בדף הקורס או בפורום לא נכללו. הדף לא מתעדכן לבד.')+'</footer>';
  document.getElementById('app').innerHTML = html;
})();
</script>
